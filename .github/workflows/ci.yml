name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite + PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql://erp:erp@localhost:5432/erp
        run: pytest -v
      - name: Demo run against the mock API
        run: python -m pipeline.run --mock --warehouse sqlite:///demo.db
