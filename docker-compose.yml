# One command demo: a Postgres warehouse, the mock Business Central API, and the pipeline.
#   docker compose up --build
# Then connect any SQL client or Power BI to localhost:5432 (user/password/db: erp).
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 2s
      retries: 20

  mock-bc:
    build: .
    command: ["python", "-m", "pipeline.mock_bc.server", "--port", "8080"]
    ports: ["8080:8080"]

  pipeline:
    build: .
    depends_on:
      warehouse: {condition: service_healthy}
      mock-bc: {condition: service_started}
    environment:
      WAREHOUSE_URL: postgresql://erp:erp@warehouse:5432/erp
      BC_BASE_URL: http://mock-bc:8080
      BC_TOKEN_URL: http://mock-bc:8080/oauth2/token
      BC_CLIENT_ID: demo
      BC_CLIENT_SECRET: demo
    # Re-run every hour, like a scheduled job. Remove the loop to run once.
    entrypoint: ["sh", "-c", "sleep 3; while true; do python -m pipeline.run; sleep 3600; done"]
